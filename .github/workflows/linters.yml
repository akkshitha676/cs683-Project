name: Linters
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check plotting script syntax
      run: python3 -m py_compile scripts/plot_checkpoint1.py
    - uses: rojopolis/spellcheck-github-actions@0.40.0
      name: Spellcheck
      with:
        config_path: .github/configs/spellcheck.yml
        use-verbose-mode: yes
        base-branch: main


  markdown-link-check:
    name: LinkCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: ".github/configs/linkcheck.json"
